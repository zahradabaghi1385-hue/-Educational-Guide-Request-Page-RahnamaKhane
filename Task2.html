<!DOCTYPE html>
<html lang="fa" dir="rtl">
<link rel="stylesheet" href="style2.css">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>راهنما خانه</title>
</head>

<body>
    <header class="header">
        <h3 class="logo">راهنماخانه</h3>

        <nav class="navbar">
            <a href="#chapters">فصل‌ها</a>
            <a href="#request">درخواست راهنما</a>
        </nav>
    </header>

    <main class="container">

        <section class="hero">

            <section class="cover">
                <span class="web">وب</span>
                <h1>راهنمای شروع یادگیری وب</h1>
                <p>نسخه آموزشی . PDF</p>
            </section>

            <section class="intro">
                <h1>راهنمای شروع یادگیری وب</h1>
                <p class="intro-text">
                    سه فصل کوتاه برای کسی که می‌خواهد ساختار صفحه،ظاهر و ثبت تغییرهای خود را مرور کند.
                </p>

                <section class="specs">
                    <article class="spec">
                        <p class="spec-label">زبان</p>
                        <p class="spec-value">نسخه فارسی</p>
                    </article>

                    <article class="spec">
                        <p class="spec-label">حجم</p>
                        <p class="spec-value">۲۰ صفحه</p>
                    </article>

                    <article class="spec">
                        <p class="spec-label">قالب</p>
                        <p class="spec-value">PDF آموزشی</p>
                    </article>
                </section>

                <p class="notice">
                    PDF در این تمرین تولید یا ارسال نمی‌شود.
                </p>
            </section>

        </section>

    </main>
